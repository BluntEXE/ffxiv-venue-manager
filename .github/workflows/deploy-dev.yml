name: deploy-dev

on:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Pull latest dev
        run: |
          cd /home/server/xiv-app-dev
          git fetch origin dev
          git reset --hard origin/dev

      - name: Push Prisma schema to dev database
        working-directory: /home/server/xiv-app-dev/apps/web
        env:
          CI: "true"
        run: |
          ~/.local/share/pnpm/pnpm install --frozen-lockfile
          export DATABASE_URL="$(grep '^DATABASE_URL=' /home/server/xiv-app-dev/.env.dev | cut -d= -f2- | tr -d '"' | sed 's/@postgres:5432/@192.168.1.122:5432/')"
          export DIRECT_URL="$(grep '^DIRECT_URL=' /home/server/xiv-app-dev/.env.dev | cut -d= -f2- | tr -d '"' | sed 's/@postgres:5432/@192.168.1.122:5432/')"
          ./node_modules/.bin/prisma db push --accept-data-loss --schema=./prisma/schema.prisma

      - name: Rebuild and restart dev container
        run: |
          cd /home/server/xiv-app
          docker compose --profile dev up -d --build venue-manager-dev
